<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>To 鼠 — 2021–2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivory: #f6f1e8;
      --ivory-deep: #efe8dc;
      --paper: #faf6ef;
      --letter: #fbf7f0;
      --ink: #3c342b;
      --ink-soft: #5a5147;
      --muted: #8a8074;
      --muted-2: #a3988b;
      --kraft: #cbbba0;
      --kraft-deep: #a89274;
      --line: rgba(90, 74, 58, 0.14);
      --shadow: rgba(58, 46, 34, 0.16);
      --shadow-deep: rgba(48, 38, 28, 0.22);
      --flap: #f3ece1;
      --flap-inner: #e8dccb;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      height: 100%;
      background: var(--ivory);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", Georgia, serif;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100dvh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }

    button {
      font-family: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 80;
      opacity: 0.038;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .world {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
    }

    /* ---------- Envelope ---------- */
    .envelope-wrap {
      position: relative;
      z-index: 10;
      width: min(84vw, 560px);
      transform: translateY(0) scale(1);
      transform-style: preserve-3d;
      opacity: 1;
      filter: none;
      transition:
        transform 1.15s var(--ease),
        opacity 1s var(--ease),
        filter 1s var(--ease);
      will-change: transform, opacity;
      perspective: 1600px;
    }

    @media (min-width: 768px) {
      .envelope-wrap {
        width: min(48vw, 620px);
      }
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1024 / 595;
      transform-style: preserve-3d;
      perspective: 1400px;
      cursor: pointer;
      box-shadow:
        0 10px 18px rgba(62, 48, 34, 0.12),
        0 2px 4px rgba(62, 48, 34, 0.06);
      transition: transform 0.55s var(--ease), box-shadow 0.55s var(--ease);
    }

    .scene-envelope .envelope:hover,
    .scene-envelope .envelope:focus-visible {
      transform: translateY(-5px);
      box-shadow:
        0 16px 24px rgba(62, 48, 34, 0.16),
        0 3px 6px rgba(62, 48, 34, 0.08);
    }

    .envelope-back,
    .envelope-front,
    .envelope-liner {
      position: absolute;
      inset: 0;
      border-radius: 2px;
    }

    .envelope-back {
      background: #e9dfd0;
      box-shadow: inset 0 0 0 1px rgba(140, 118, 90, 0.12);
      z-index: 1;
    }

    .envelope-liner {
      background:
        linear-gradient(180deg, rgba(232, 214, 190, 0.55), rgba(232, 214, 190, 0) 42%),
        #efe4d4;
      z-index: 2;
      clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%);
    }

    .peek-letter {
      position: absolute;
      left: 9%;
      right: 9%;
      top: 8%;
      height: 82%;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.35), transparent 30%),
        var(--letter);
      border-radius: 1px;
      z-index: 3;
      box-shadow: 0 1px 2px rgba(60, 45, 30, 0.08);
      transform: translateY(48%);
      opacity: 0;
      transition: transform 1s var(--ease), opacity 0.35s ease;
      overflow: hidden;
    }

    .peek-letter::before {
      content: "";
      display: block;
      width: 72%;
      height: 1px;
      background: rgba(90, 74, 58, 0.16);
      margin: 18% auto 10px;
    }
    .peek-letter::after {
      content: "";
      display: block;
      width: 64%;
      height: 1px;
      background: rgba(90, 74, 58, 0.12);
      margin: 0 auto 8px;
      box-shadow:
        0 12px 0 rgba(90, 74, 58, 0.1),
        0 24px 0 rgba(90, 74, 58, 0.08),
        0 36px 0 rgba(90, 74, 58, 0.07);
    }

    .envelope-front {
      overflow: hidden;
      z-index: 4;
      background: var(--ivory);
      clip-path: polygon(0 17%, 50% 34%, 100% 17%, 100% 100%, 0 100%);
    }

    .envelope-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 34%;
      z-index: 6;
      transform-origin: top center;
      transform-style: preserve-3d;
      transform: rotateX(0deg);
      transition: transform 0.75s var(--ease);
      pointer-events: none;
      will-change: transform;
    }

    .flap-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      clip-path: polygon(0 0, 100% 0, 98.5% 68%, 50% 100%, 1.5% 68%);
    }

    .flap-face--front {
      background:
        linear-gradient(180deg, #f7f1e7 0%, #f1eadc 70%, #e8dccb 100%);
      box-shadow: inset 0 -1px 0 rgba(140, 118, 90, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 2%;
    }

    .flap-face--inner {
      background:
        linear-gradient(180deg, #d9c9b0, #e7d9c4);
      transform: rotateX(180deg);
    }

    .addr-to {
      font-size: clamp(1.35rem, 3.6vw, 1.85rem);
      color: #4a4036;
      letter-spacing: 0.04em;
      line-height: 1;
      transform: translateY(4px);
    }

    .addr-to i {
      font-family: "Great Vibes", "Caveat", cursive;
      font-style: normal;
      font-weight: 400;
      margin-right: 0.28em;
      font-size: 1.18em;
    }

    .addr-to b {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-weight: 500;
      font-size: 0.92em;
    }

    .addr-date {
      margin-top: 0.18em;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(0.68rem, 1.7vw, 0.82rem);
      color: var(--muted);
      letter-spacing: 0.16em;
    }

    .invite {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 22px);
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 0.86rem;
      letter-spacing: 0.12em;
      color: var(--muted-2);
      opacity: 0.85;
      transition: opacity 0.4s ease;
    }

    .scene-envelope .envelope-wrap:hover .invite {
      opacity: 0.55;
    }

    /* Opening / receding */
    .scene-opening .flap,
    .scene-letter .flap,
    .scene-photos-out .flap,
    .scene-photos .flap,
    .scene-finale .flap {
      transform: rotateX(-162deg);
    }

    .scene-opening .peek-letter {
      opacity: 1;
      transform: translateY(-36%);
    }

    .scene-letter .envelope-wrap,
    .scene-photos .envelope-wrap,
    .scene-finale .envelope-wrap {
      pointer-events: none;
    }

    .scene-letter .envelope-wrap {
      transform: translateY(38vh) scale(0.52);
      opacity: 0.12;
    }

    .scene-letter .invite,
    .scene-opening .invite,
    .scene-photos-out .invite,
    .scene-photos .invite,
    .scene-finale .invite {
      opacity: 0;
    }

    .scene-photos-out .envelope-wrap {
      transform: translateY(6vh) scale(0.92);
      opacity: 1;
      filter: none;
      z-index: 12;
    }

    .scene-photos-out .peek-letter {
      opacity: 0;
    }

    .scene-photos .envelope-wrap {
      transform: translateY(40vh) scale(0.5);
      opacity: 0.1;
    }

    .scene-finale .envelope-wrap {
      transform: translateY(8vh) scale(0.7);
      opacity: 0;
    }

    @media (max-width: 700px) {
      .scene-letter .envelope-wrap,
      .scene-photos .envelope-wrap {
        transform: translateY(40vh) scale(0.5);
        opacity: 0.1;
      }
    }

    /* ---------- Letter ---------- */
    .letter-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(520px, calc(100vw - 48px));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -42%) scale(0.34);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      touch-action: none;
      transition:
        transform 1.15s var(--ease),
        opacity 0.55s ease,
        visibility 0s linear 0.6s;
    }

    .scene-opening .letter-stage {
      opacity: 0;
    }

    .scene-letter .letter-stage {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
      transition-delay: 0.35s, 0.42s, 0s;
    }

    .scene-photos-out .letter-stage,
    .scene-photos .letter-stage,
    .scene-finale .letter-stage {
      opacity: 0;
      pointer-events: none;
      transform: translate(-120%, -50%) scale(0.92);
      transition-delay: 0s;
    }

    .letter-sheet {
      position: relative;
      width: 100%;
      background: var(--letter);
      min-height: 0;
      max-height: calc(100dvh - 72px);
      padding: 1.55rem 1.45rem 2.55rem;
      border-radius: 1px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.7) inset,
        0 18px 40px rgba(58, 46, 34, 0.12),
        0 2px 6px rgba(58, 46, 34, 0.06);
      overflow: hidden;
    }

    .letter-sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(80, 60, 40, 0.035), transparent 18%, transparent 82%, rgba(80, 60, 40, 0.03)),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      opacity: 0.18;
      mix-blend-mode: multiply;
    }

    .letter-pages {
      position: relative;
      min-height: 0;
    }

    .letter-page {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateX(18px);
      pointer-events: none;
      transition: opacity 0.42s var(--ease), transform 0.42s var(--ease);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.4rem;
    }

    .letter-page.is-active {
      opacity: 1;
      visibility: visible;
      transform: none;
      position: relative;
    }

    .letter-page.is-exit-left,
    .letter-page.is-exit-right {
      visibility: visible;
    }

    .letter-page.is-exit-left {
      opacity: 0;
      transform: translateX(-22px);
    }

    .letter-page.is-exit-right {
      opacity: 0;
      transform: translateX(22px);
    }

    .letter-page p {
      font-size: 16px;
      line-height: 1.82;
      color: var(--ink);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-align: start;
      text-indent: 2em;
    }

    .letter-page p + p {
      margin-top: 0.8em;
    }

    .letter-hint {
      position: relative;
      z-index: 5;
      display: inline-block;
      margin-top: 1.05rem;
      font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
      font-size: 1.12rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      border-bottom: 1px solid rgba(138, 128, 116, 0.35);
      padding-bottom: 1px;
      min-height: 44px;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .letter-hint:hover,
    .letter-hint:focus-visible {
      color: var(--ink-soft);
      border-color: var(--ink-soft);
    }

    .letter-counter {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.05rem;
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: var(--muted-2);
      pointer-events: none;
    }

    .close-letter {
      position: relative;
      z-index: 6;
      margin-top: 0.7rem;
      font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
      font-size: 1.05rem;
      color: var(--muted);
      min-height: 44px;
      padding: 8px 14px;
      transition: color 0.25s ease;
    }

    .close-letter:hover,
    .close-letter:focus-visible {
      color: var(--ink);
    }

    .hit {
      position: absolute;
      top: 0;
      bottom: 2.6rem;
      width: 28%;
      z-index: 3;
      background: transparent;
    }
    .hit--left { left: 0; cursor: w-resize; }
    .hit--right { right: 0; cursor: e-resize; }

    .photo-stack .photo-hits {
      position: absolute;
      inset: 0;
      z-index: 15;
    }

    /* ---------- Nav arrows ---------- */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      z-index: 40;
      color: var(--ink-soft);
      background: rgba(250, 246, 239, 0.72);
      opacity: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      transition: opacity 0.35s ease, background 0.25s ease, color 0.25s ease;
    }

    .nav-arrow svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
    }

    .nav-arrow--prev { left: max(8px, env(safe-area-inset-left)); }
    .nav-arrow--next { right: max(8px, env(safe-area-inset-right)); }

    .scene-letter .nav-arrow,
    .scene-photos .nav-arrow {
      opacity: 0.78;
      pointer-events: auto;
    }

    .nav-arrow:hover,
    .nav-arrow:focus-visible {
      opacity: 0.95;
      color: var(--ink);
      background: rgba(255, 252, 247, 0.55);
    }

    .nav-arrow:disabled {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Photos ---------- */
    .photos-stage {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(72vw, 360px);
      z-index: 25;
      transform: translate(-50%, -40%) scale(0.42);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      touch-action: none;
      transition: transform 1.1s var(--ease), opacity 0.55s ease, visibility 0s linear 0.6s;
    }

    .scene-photos-out .photos-stage {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -58%) scale(0.7);
      transition-delay: 0.35s, 0.28s, 0s;
    }

    .scene-photos .photos-stage {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -54%) scale(1);
    }

    .scene-finale .photos-stage {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.82) rotate(-2deg);
    }

    .photo-frame {
      position: relative;
      width: 100%;
    }

    .photo-stack {
      position: relative;
      width: min(100%, calc(62dvh * 3 / 4.2));
      aspect-ratio: 3 / 4.2;
      margin: 0 auto;
    }

    .photo-frame .photo-hits {
      position: absolute;
      inset: 0;
      z-index: 16;
    }

    .photo-print {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100%;
      transform: translateX(-50%) rotate(var(--rot, 0deg));
      background: #f8f6f1;
      padding: 10px 10px 12px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.8) inset,
        0 12px 28px rgba(48, 38, 28, 0.16),
        0 2px 6px rgba(48, 38, 28, 0.08);
      transition:
        transform 0.55s var(--ease),
        opacity 0.45s ease,
        filter 0.45s ease;
      transform-origin: 50% 70%;
    }

    .photo-print img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #ece6da;
      pointer-events: none;
      user-select: none;
    }

    .photo-print.is-behind {
      pointer-events: none;
    }

    .photo-print.is-leaving-left {
      opacity: 0;
      transform: translateX(calc(-50% - 78%)) rotate(-10deg);
      pointer-events: none;
    }

    .photo-print.is-leaving-right {
      opacity: 0;
      transform: translateX(calc(-50% + 78%)) rotate(10deg);
      pointer-events: none;
    }

    .photo-print.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.96);
    }

    .photo-caption {
      margin-top: 14px;
      text-align: center;
      min-height: 2.4em;
    }

    .photo-caption .place {
      display: block;
      font-family: "Caveat", cursive;
      font-size: 1.28rem;
      color: #6a5e52;
      line-height: 1.1;
    }

    .photo-caption .when {
      display: block;
      margin-top: 2px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      color: var(--muted-2);
    }

    .photo-counter {
      margin-top: 10px;
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: var(--muted-2);
    }

    .photo-hits {
      position: absolute;
      inset: 0;
      z-index: 5;
    }
    .photo-hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
    }
    .photo-hit--prev { left: 0; cursor: w-resize; }
    .photo-hit--next { right: 0; cursor: e-resize; }

    /* ---------- Finale ---------- */
    .finale-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(86vw, 480px);
      z-index: 30;
      transform: translate(-50%, -46%);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1s var(--ease), transform 1s var(--ease), visibility 0s linear 0.6s;
    }

    .scene-finale .finale-stage {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%);
      transition-delay: 0.35s, 0.35s, 0s;
    }

    .finale-line {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.45rem, 4.4vw, 2.05rem);
      line-height: 1.45;
      color: var(--ink-soft);
    }

    .finale-years {
      margin-top: 1.15rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.28em;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .replay {
      margin-top: 2.4rem;
      font-family: "Ma Shan Zheng", "Noto Serif SC", cursive;
      font-size: 1.18rem;
      color: var(--muted);
      min-height: 44px;
      padding: 8px 12px;
      border-bottom: 1px solid transparent;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .replay:hover,
    .replay:focus-visible {
      color: var(--ink);
      border-bottom-color: rgba(90, 74, 58, 0.35);
    }

    @media (max-width: 699px) {
      .letter-stage {
        width: calc(100vw - 44px);
      }
      .letter-sheet {
        padding: 1.35rem 1.1rem 2.4rem;
        min-height: 0;
      }
      .letter-page p {
        font-size: 16px;
        line-height: 1.82;
      }
      .hit { width: 22%; }
      .invite { top: calc(100% + 16px); font-size: 0.8rem; }
      .nav-arrow {
        width: 36px;
        height: 36px;
        background: transparent;
      }
      .scene-letter .nav-arrow,
      .scene-photos .nav-arrow {
        opacity: 0.42;
      }
      .scene-photos .photos-stage {
        top: 44%;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (min-width: 700px) {
      .letter-page p { font-size: 17px; line-height: 1.82; }
      .letter-sheet { padding: 1.7rem 1.7rem 2.7rem; }
      .nav-arrow--prev { left: calc(50% - min(46vw, 340px) - 8px); }
      .nav-arrow--next { right: calc(50% - min(46vw, 340px) - 8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="scene-envelope">
  <div class="grain" aria-hidden="true"></div>

  <div class="world" id="world">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="打开给鼠的信">
        <div class="envelope-back"></div>
        <div class="envelope-liner"></div>
        <div class="peek-letter" aria-hidden="true"></div>
        <div class="envelope-front">
          <img src="envelope.jpg" alt="湖边相拥的两个人，封面写着 Happy 5th Anniversary" />
        </div>
        <div class="flap" aria-hidden="true">
          <div class="flap-face flap-face--front">
            <span class="addr-to"><i>To</i><b>鼠</b></span>
            <span class="addr-date">2021 — 2026</span>
          </div>
          <div class="flap-face flap-face--inner"></div>
        </div>
      </div>
      <p class="invite">轻触打开</p>
    </div>

    <section class="letter-stage" id="letterStage" aria-hidden="true">
      <article class="letter-sheet" id="letterSheet">
        <div class="letter-pages" id="letterPages"></div>
        <div class="hit hit--left" data-dir="prev" aria-hidden="true"></div>
        <div class="hit hit--right" data-dir="next" aria-hidden="true"></div>
        <div class="letter-counter" id="letterCounter">01 / 05</div>
      </article>
      <button class="close-letter" id="closeLetter" type="button">合上信封</button>
    </section>

    <section class="photos-stage" id="photosStage" aria-hidden="true">
      <div class="photo-frame">
        <div class="photo-stack" id="photoStack"></div>
        <div class="photo-hits">
          <div class="photo-hit photo-hit--prev" data-dir="prev"></div>
          <div class="photo-hit photo-hit--next" data-dir="next"></div>
        </div>
      </div>
      <div class="photo-caption" id="photoCaption">
        <span class="place"></span>
        <span class="when"></span>
      </div>
      <div class="photo-counter" id="photoCounter">01 / 18</div>
    </section>

    <section class="finale-stage" id="finaleStage" aria-hidden="true">
      <p class="finale-line">Five years down,<br />many more adventures to go.</p>
      <p class="finale-years">2021 — 2026</p>
      <button class="replay" id="replay" type="button">再看一次</button>
    </section>
  </div>

  <button class="nav-arrow nav-arrow--prev" id="prevBtn" type="button" aria-label="上一页">
    <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" /></svg>
  </button>
  <button class="nav-arrow nav-arrow--next" id="nextBtn" type="button" aria-label="下一页">
    <svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19" /></svg>
  </button>

  <script>
    const LETTER_PAGES = [
      [
        "亲爱的鼠，当你收到这封信，我们已经在一起5年3天啦。",
        "没有当面把信给你，是因为旅行结束之后也有了很多新的想法。在纸上删删改改，还是用这样的方式纪念我们这一年吧～",
        "因为老实说，我发现真正到了五周年这一天时，我的心情很复杂，一方面，积年累月的长期感情当然值得庆祝和骄傲，另一方面，很多关于将来的担忧也占据了我的大脑。像我们在圣沃尔夫冈的小山坡上那次对话一样，我的未来还是一片迷雾，对于任何不确定的事情更是忧心忡忡（现在也还是有点，回家打开电脑，看到一个工作申请都没有进展，感觉很前途渺茫了呜呜呜）。"
      ],
      [
        "尽管接触更大的世界也意味着更大的不安全感，但回顾这一年，也算是收获良多，过上了大学期间从未想象过的日子。我们在塞维利亚一起听了新年的钟声，待到春暖花开时，你又来到我上学的城市，走过我走过的每一个街道、超市、公园，然后一起在南法漫步蔚蓝海岸，去迪士尼拜访我们最爱的料理老鼠……很多个幻想着和你一起去的地方，一起做的事情，都慢慢实现了。这一个个幸福的记忆随着时间流逝，或许已经不那么清晰了，但其实都成为了我迈向更美好生活的坚实动力💪"
      ],
      [
        "2026走到了年末，我们的猪鼠欧洲游，和一年多的异国恋一起，也快走到尾声了，这一年来还是很感谢你在每个假期都抽空坐久久的飞机来看我🥹让我这一年也没有那么漫长和孤单，也谢谢你在旅途中的照顾和包容，你永远都是那个愿意陪我探险、体验未知的人。我会一直记得我们在奥地利湖区短短的两天里体验了划船、徒步、越野跑，尽管只有一天半，但还是看了三个小镇许多的湖光山色，我们是最好的旅伴❤️"
      ],
      [
        "我们在布拉格一起看了两次日落，一次在蓝调的老城广场，一次在有水豚的湖心岛上。越长大我越觉得抓不住时间的流逝，就像沙子一样从指尖一下子就流走了，所以每次看到夕阳我都会陷入深深的沉思，对于一天、一周、一年的过去，我们是如此无力。既然如此，我们只能珍惜每一次在一起的当下，去深深感受每一个受到触动的瞬间，然后把这些最真实的身体体验，转化为每个平凡日子里的小小动力吧——我们会再出发，再冒险的！"
      ],
      [
        "最后，还是谢谢这段感情教会我怎么爱（虽然还在不聡明地学习中…会认真研读实践你发给我的指南的），希望多年的成长能让我们更加成熟，更加从容地面对我们的未来，希望我们进入新的人生阶段之后，也会有更美好的生活✌️"
      ]
    ];

    const PHOTOS = [
      { src: "photos/01.jpg", place: "Our 4th Anniversary", date: "" },
      { src: "photos/02.jpg", place: "Casa Batlló", date: "Barcelona" },
      { src: "photos/03.jpg", place: "Sagrada Família", date: "Barcelona" },
      { src: "photos/04.jpg", place: "The Louvre", date: "Paris" },
      { src: "photos/05.jpg", place: "Big Ben", date: "London" },
      { src: "photos/06.jpg", place: "The White Cliffs", date: "Brighton" },
      { src: "photos/07.jpg", place: "The Seine", date: "Paris" },
      { src: "photos/08.jpg", place: "Disneyland Paris", date: "" },
      { src: "photos/09.jpg", place: "Disneyland Paris", date: "" },
      { src: "photos/10.jpg", place: "Disneyland Paris", date: "" },
      { src: "photos/11.jpg", place: "Nice", date: "France" },
      { src: "photos/12.jpg", place: "Antibes", date: "France" },
      { src: "photos/13.jpg", place: "Belvedere Palace", date: "Vienna" },
      { src: "photos/14.jpg", place: "Alt & Neu", date: "Vienna" },
      { src: "photos/15.jpg", place: "St. Wolfgang", date: "Austria" },
      { src: "photos/16.jpg", place: "Hallstatt", date: "Austria" },
      { src: "photos/17.jpg", place: "Charles Bridge", date: "Prague" },
      { src: "photos/18.jpg", place: "Old Town Square", date: "Prague" }
    ];

    const ROTS = [-1.4, 1.1, -0.7, 1.8, -1.9, 0.6, 1.4, -1.1, 2.0, -0.5, 1.6, -1.7, 0.8, -1.5, 1.3, -0.9, 1.7, -1.2];

    const body = document.body;
    const envelope = document.getElementById("envelope");
    const letterPagesEl = document.getElementById("letterPages");
    const letterCounter = document.getElementById("letterCounter");
    const photoStack = document.getElementById("photoStack");
    const photoCaption = document.getElementById("photoCaption");
    const photoCounter = document.getElementById("photoCounter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const letterStage = document.getElementById("letterStage");
    const photosStage = document.getElementById("photosStage");
    const finaleStage = document.getElementById("finaleStage");

    const state = {
      scene: "envelope",
      letterPage: 0,
      photoIndex: 0,
      animating: false
    };

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function setScene(scene) {
      body.className = "scene-" + scene;
      state.scene = scene;
      letterStage.setAttribute("aria-hidden", scene !== "letter");
      photosStage.setAttribute("aria-hidden", scene !== "photos");
      finaleStage.setAttribute("aria-hidden", scene !== "finale");
      updateArrows();
    }

    function svgScene(name) {
      const scenes = {
        sevillaBells: `<rect width="900" height="600" fill="#c9a078"/><rect y="330" width="900" height="270" fill="#8c5b3c"/><rect x="360" y="90" width="90" height="280" fill="#6d3e2a"/><rect x="378" y="40" width="54" height="70" fill="#5a3222"/><circle cx="720" cy="110" r="38" fill="#f0d9a8" opacity="0.85"/><path d="M0 340 C200 280 400 380 900 300 L900 600 L0 600Z" fill="#a56b45" opacity="0.7"/>`,
        sevillaPlaza: `<rect width="900" height="600" fill="#e2c39a"/><circle cx="680" cy="90" r="46" fill="#f4e1b8"/><path d="M0 420 L900 360 L900 600 L0 600Z" fill="#b07a52"/><rect x="120" y="250" width="160" height="180" fill="#8a4e36"/><rect x="360" y="210" width="200" height="220" fill="#7a4330"/><rect x="640" y="260" width="140" height="170" fill="#93553c"/>`,
        londonStreet: `<rect width="900" height="600" fill="#b7c0c4"/><rect y="360" width="900" height="240" fill="#8b9296"/><rect x="80" y="160" width="150" height="230" fill="#7d5b52"/><rect x="260" y="120" width="170" height="270" fill="#6f534c"/><rect x="520" y="150" width="140" height="240" fill="#81635c"/><rect x="700" y="180" width="130" height="210" fill="#6a504a"/><path d="M0 430 L900 400 L900 600 L0 600Z" fill="#6e7578"/>`,
        londonPark: `<rect width="900" height="600" fill="#c5d0c4"/><ellipse cx="200" cy="340" rx="160" ry="90" fill="#7d9470"/><ellipse cx="520" cy="300" rx="200" ry="110" fill="#6f8664"/><ellipse cx="780" cy="360" rx="140" ry="80" fill="#88a07a"/><path d="M0 430 C250 400 500 470 900 410 L900 600 L0 600Z" fill="#9aaa8c"/><circle cx="140" cy="120" r="28" fill="#e7e0d2"/>`,
        azurCoast: `<rect width="900" height="600" fill="#d7e4ea"/><circle cx="760" cy="92" r="40" fill="#f2e4c4"/><path d="M0 250 C220 210 420 280 900 200 L900 600 L0 600Z" fill="#5e8ea8"/><path d="M0 340 C300 300 560 390 900 320 L900 600 L0 600Z" fill="#3f738c"/><path d="M0 470 C240 450 500 510 900 460 L900 600 L0 600Z" fill="#d9c7a6"/>`,
        azurTown: `<rect width="900" height="600" fill="#e7ddd0"/><path d="M0 280 L900 220 L900 600 L0 600Z" fill="#6a9aaa"/><rect x="140" y="250" width="90" height="110" fill="#e8d3c0"/><rect x="250" y="230" width="80" height="130" fill="#d9b7a4"/><rect x="350" y="240" width="100" height="120" fill="#f0e6d8"/><path d="M0 430 L900 400 L900 600 L0 600Z" fill="#cbb79a"/>`,
        parisKitchen: `<rect width="900" height="600" fill="#eadcc4"/><circle cx="180" cy="110" r="44" fill="#f0d9a0"/><rect x="200" y="220" width="500" height="220" fill="#6e8a62"/><rect x="230" y="250" width="180" height="130" fill="#c45c48"/><rect x="470" y="260" width="160" height="110" fill="#3d4a3a"/><path d="M0 480 L900 450 L900 600 L0 600Z" fill="#c4b396"/>`,
        austriaLake: `<rect width="900" height="600" fill="#c5d3dc"/><path d="M80 340 L260 140 L420 300 L560 120 L820 310 L900 260 L900 600 L0 600 L0 380Z" fill="#6f7f6a"/><path d="M0 390 C240 350 520 430 900 360 L900 600 L0 600Z" fill="#4f7e86"/>`,
        austriaTrail: `<rect width="900" height="600" fill="#d5d0c2"/><ellipse cx="260" cy="260" rx="170" ry="210" fill="#5d6e50"/><ellipse cx="640" cy="240" rx="200" ry="230" fill="#4f6146"/><path d="M320 600 C400 420 500 430 580 600" fill="#c2b49a"/>`,
        austriaBoat: `<rect width="900" height="600" fill="#cfd8d4"/><path d="M0 220 L180 90 L340 210 L500 70 L740 200 L900 110 L900 600 L0 600Z" fill="#8b9278"/><path d="M0 360 C260 330 580 410 900 350 L900 600 L0 600Z" fill="#5b7d82"/><ellipse cx="430" cy="400" rx="90" ry="18" fill="#6a5340"/>`,
        pragueSquare: `<rect width="900" height="600" fill="#e3b48a"/><circle cx="760" cy="100" r="50" fill="#f0c58a"/><rect x="80" y="220" width="140" height="200" fill="#8a4334"/><rect x="260" y="180" width="180" height="240" fill="#6e3328"/><rect x="520" y="200" width="130" height="220" fill="#7a3b2e"/><rect x="700" y="230" width="120" height="190" fill="#935043"/><path d="M0 430 L900 400 L900 600 L0 600Z" fill="#c48a62"/>`,
        pragueIsland: `<rect width="900" height="600" fill="#7f91a6"/><circle cx="720" cy="90" r="46" fill="#f0c9a0"/><ellipse cx="450" cy="340" rx="260" ry="70" fill="#6d7d5c"/><path d="M0 360 C220 320 500 400 900 330 L900 600 L0 600Z" fill="#4d6c78"/><ellipse cx="200" cy="430" rx="40" ry="16" fill="#c4b7a2"/>`
      };
      const inner = scenes[name] || scenes.austriaLake;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">${inner}<rect width="900" height="600" fill="#5a4a3a" opacity="0.08"/></svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function renderLetter() {
      letterPagesEl.innerHTML = LETTER_PAGES.map((paras, i) => {
        const last = i === LETTER_PAGES.length - 1;
        const html = paras.map((p, idx) => `<p${idx === 0 ? ' class="lede"' : ""}>${p}</p>`).join("");
        const hint = last
          ? `<button class="letter-hint" id="letterHint" type="button">回顾一下我们这一年吧～</button>`
          : "";
        return `<div class="letter-page${i === 0 ? " is-active" : ""}" data-page="${i}">${html}${hint}</div>`;
      }).join("");
      letterPagesEl.querySelector("#letterHint")?.addEventListener("click", (e) => {
        e.stopPropagation();
        openPhotos();
      });
    }

    function renderPhotos() {
      photoStack.innerHTML = PHOTOS.map((photo, i) => {
        const src = photo.src || svgScene(photo.scene);
        return `<figure class="photo-print" data-index="${i}" style="--rot:${ROTS[i % ROTS.length]}deg">
          <img src="${src}" alt="${photo.place}${photo.date ? ", " + photo.date : ""}" />
        </figure>`;
      }).join("");
      layoutPhotos();
      updatePhotoCaption();
    }

    function layoutPhotos() {
      const prints = [...photoStack.querySelectorAll(".photo-print")];
      prints.forEach((el, i) => {
        el.classList.remove("is-leaving-left", "is-leaving-right", "is-behind", "is-hidden");
        const d = i - state.photoIndex;
        if (d < 0) {
          el.classList.add("is-hidden");
          el.style.zIndex = 0;
          return;
        }
        if (d === 0) {
          el.style.zIndex = 10;
          el.style.transform = `translateX(-50%) rotate(${ROTS[i % ROTS.length]}deg)`;
          return;
        }
        if (d > 3) {
          el.classList.add("is-hidden");
          el.style.zIndex = 1;
          return;
        }
        el.classList.add("is-behind");
        const x = d % 2 === 0 ? 10 : -9;
        const y = 7 * d;
        const r = ROTS[(i + d) % ROTS.length] + d * 0.4;
        el.style.zIndex = String(10 - d);
        el.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${r}deg)`;
      });
    }

    function updatePhotoCaption() {
      const photo = PHOTOS[state.photoIndex];
      photoCaption.querySelector(".place").textContent = photo.place;
      const when = photoCaption.querySelector(".when");
      when.textContent = photo.date || "";
      when.hidden = !photo.date;
      photoCounter.textContent = `${pad(state.photoIndex + 1)} / ${pad(PHOTOS.length)}`;
    }

    function goLetterPage(nextIndex, dir) {
      if (nextIndex < 0 || nextIndex >= LETTER_PAGES.length) return;
      if (nextIndex === state.letterPage) return;
      const pages = [...letterPagesEl.querySelectorAll(".letter-page")];
      const current = pages[state.letterPage];
      const incoming = pages[nextIndex];
      current.classList.remove("is-active");
      current.classList.add(dir === 1 ? "is-exit-left" : "is-exit-right");
      incoming.classList.remove("is-exit-left", "is-exit-right");
      incoming.style.transform = dir === 1 ? "translateX(18px)" : "translateX(-18px)";
      incoming.offsetHeight;
      incoming.classList.add("is-active");
      incoming.style.transform = "";
      setTimeout(() => current.classList.remove("is-exit-left", "is-exit-right"), 420);
      state.letterPage = nextIndex;
      letterCounter.textContent = `${pad(state.letterPage + 1)} / ${pad(LETTER_PAGES.length)}`;
      updateArrows();
    }

    function openEnvelope() {
      if (state.scene !== "envelope" || state.animating) return;
      state.animating = true;
      setScene("opening");
      window.setTimeout(() => {
        setScene("letter");
        state.animating = false;
      }, 1250);
    }

    function openPhotos() {
      if (state.animating) return;
      state.animating = true;
      setScene("photos-out");
      window.setTimeout(() => {
        setScene("photos");
        state.animating = false;
      }, 1150);
    }

    function goPhoto(dir) {
      const next = state.photoIndex + dir;
      if (next < 0) return;
      if (next >= PHOTOS.length) {
        openFinale();
        return;
      }
      const current = photoStack.querySelector(`[data-index="${state.photoIndex}"]`);
      current?.classList.add(dir === 1 ? "is-leaving-left" : "is-leaving-right");
      state.photoIndex = next;
      window.setTimeout(() => {
        layoutPhotos();
      }, 80);
      updatePhotoCaption();
      updateArrows();
    }

    function openFinale() {
      if (state.animating) return;
      state.animating = true;
      setScene("finale");
      window.setTimeout(() => { state.animating = false; }, 800);
    }

    function replay() {
      state.letterPage = 0;
      state.photoIndex = 0;
      [...letterPagesEl.querySelectorAll(".letter-page")].forEach((el, i) => {
        el.classList.toggle("is-active", i === 0);
        el.classList.remove("is-exit-left", "is-exit-right");
      });
      letterCounter.textContent = `01 / ${pad(LETTER_PAGES.length)}`;
      layoutPhotos();
      updatePhotoCaption();
      setScene("envelope");
    }

    function updateArrows() {
      const onLetter = state.scene === "letter";
      const onPhotos = state.scene === "photos";
      const show = onLetter || onPhotos;
      prevBtn.disabled = onLetter ? state.letterPage === 0 : state.photoIndex === 0;
      nextBtn.disabled = false;
      prevBtn.style.visibility = show ? "visible" : "hidden";
      nextBtn.style.visibility = show ? "visible" : "hidden";
    }

    function next() {
      if (state.scene === "letter") {
        if (state.letterPage === LETTER_PAGES.length - 1) openPhotos();
        else goLetterPage(state.letterPage + 1, 1);
      } else if (state.scene === "photos") {
        goPhoto(1);
      }
    }

    function prev() {
      if (state.scene === "letter") goLetterPage(state.letterPage - 1, -1);
      else if (state.scene === "photos") goPhoto(-1);
    }

    envelope.addEventListener("click", openEnvelope);
    envelope.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openEnvelope();
      }
    });

    prevBtn.addEventListener("click", prev);
    nextBtn.addEventListener("click", next);
    document.getElementById("replay").addEventListener("click", replay);
    document.getElementById("closeLetter").addEventListener("click", (e) => {
      e.stopPropagation();
      replay();
    });

    document.getElementById("letterSheet").addEventListener("click", (e) => {
      if (state.scene !== "letter") return;
      if (e.target.closest(".letter-hint")) return;
      const hit = e.target.closest(".hit");
      if (!hit) return;
      hit.dataset.dir === "next" ? next() : prev();
    });

    photosStage.addEventListener("click", (e) => {
      if (state.scene !== "photos") return;
      const hit = e.target.closest(".photo-hit");
      if (!hit) return;
      hit.dataset.dir === "next" ? next() : prev();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    });

    let touchX = 0;
    let touchY = 0;
    let touching = false;

    function bindSwipe(el) {
      el.addEventListener("touchstart", (e) => {
        const t = e.changedTouches[0];
        touchX = t.clientX;
        touchY = t.clientY;
        touching = true;
      }, { passive: true });

      el.addEventListener("touchend", (e) => {
        if (!touching) return;
        touching = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchX;
        const dy = t.clientY - touchY;
        if (Math.abs(dx) < 46) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.15) return;
        dx < 0 ? next() : prev();
      }, { passive: true });
    }

    bindSwipe(letterStage);
    bindSwipe(photosStage);

    renderLetter();
    renderPhotos();
    updateArrows();
  </script>
</body>
</html>
